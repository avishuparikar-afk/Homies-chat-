<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Homies Chat</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">🔒</div>
      <h2>Welcome Back</h2>
      <p>Sign in to your account or create a new profile</p>
    </div>

    <!-- Alert Message Banner -->
    <div id="auth-alert" class="auth-alert"></div>

    <!-- Tabs Navigation -->
    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab-btn active" type="button">Sign In</button>
      <button id="tab-register" class="auth-tab-btn" type="button">Register</button>
    </div>

    <!-- Sign In Form -->
    <form id="form-login" class="auth-form">
      <div class="form-group">
        <label for="login-email">Email Address</label>
        <input id="login-email" class="form-input" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input id="login-password" class="form-input" type="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button class="auth-btn-submit" type="submit">Sign In</button>
    </form>

    <!-- Register Form -->
    <form id="form-register" class="auth-form" style="display: none;">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <input id="reg-username" class="form-input" type="text" placeholder="e.g. alex_rivera" minlength="3" maxlength="30" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <input id="reg-email" class="form-input" type="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="reg-password">Password (min 6 characters)</label>
        <input id="reg-password" class="form-input" type="password" placeholder="••••••••" minlength="6" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="reg-bio">Status / Bio (optional)</label>
        <input id="reg-bio" class="form-input" type="text" placeholder="Hey there! I am using Homies Chat." maxlength="120">
      </div>

      <button class="auth-btn-submit" type="submit">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>Secure JWT &amp; bcrypt password encryption active</p>
    </div>
  </div>

  <script src="/js/services/api.service.js"></script>
  <script src="/js/components/auth.controller.js"></script>
</body>
</html>
